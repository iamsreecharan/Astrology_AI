# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: astral-astrology-ai
    runtime: node
    plan: free
    branch: main
    buildCommand: npm ci --include=dev --no-audit --no-fund && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24.19.0"
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
